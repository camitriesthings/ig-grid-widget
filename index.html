<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IG Grid Planner</title>
<style>
:root{--bg:#fafafa;--surface:#fff;--border:#dbdbdb;--text:#262626;--subtext:#8e8e8e;--accent:#E1306C;--badge-bg:#efefef;--shadow:rgba(0,0,0,0.12);--overlay:rgba(0,0,0,0.5);--link:#00376b}
[data-theme="dark"]{--bg:#0e0e0e;--surface:#1a1a1a;--border:#2a2a2a;--text:#f0f0f0;--subtext:#aaa;--badge-bg:#2a2a2a;--shadow:rgba(0,0,0,0.4);--overlay:rgba(0,0,0,0.75);--link:#89c4ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;max-width:480px;margin:0 auto}
#setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:460px;box-shadow:0 4px 24px var(--shadow)}
.setup-card h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.setup-card>p{color:var(--subtext);font-size:.85rem;margin-bottom:20px}
label{display:block;font-size:.72rem;font-weight:700;margin-bottom:4px;color:var(--subtext);text-transform:uppercase;letter-spacing:.05em}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;background:var(--bg);color:var(--text);margin-bottom:12px;outline:none;transition:border-color .2s;font-family:inherit}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);margin:14px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.btn-primary{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.error-msg{color:#e04040;font-size:.8rem;margin-top:8px;display:none}
.highlight-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
#widget{display:none;background:var(--bg);min-height:100vh}
#profileSection{background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.profile-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;position:relative}
.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;flex-shrink:0}
.profile-avatar-placeholder{width:76px;height:76px;border-radius:50%;background:#c7c7c7;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.profile-avatar-placeholder svg{width:52px;height:52px;fill:#fff}
.profile-names{flex:1}
.profile-username{font-size:1.05rem;font-weight:700;line-height:1.3}
.profile-displayname{font-size:.88rem;color:var(--subtext);margin-top:2px}
.profile-menu-btn{position:absolute;top:0;right:0;background:var(--badge-bg);border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.95rem;font-weight:700;color:var(--text);letter-spacing:1px}
.profile-bio{font-size:.88rem;line-height:1.55;white-space:pre-wrap;margin-bottom:6px}
.profile-link{color:var(--link);font-size:.88rem;font-weight:600;text-decoration:none;display:block;margin-bottom:14px}
.profile-link:hover{text-decoration:underline}
#highlightsRow{display:flex;gap:18px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
#highlightsRow::-webkit-scrollbar{display:none}
.highlight-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer}
.highlight-circle{width:62px;height:62px;border-radius:50%;background:var(--badge-bg);border:2px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.highlight-circle img{width:100%;height:100%;object-fit:cover}
.highlight-label{font-size:.68rem;color:var(--text);text-align:center;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.action-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);position:relative}
.action-btn{display:flex;align-items:center;gap:6px;background:var(--badge-bg);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:.88rem;font-weight:500;cursor:pointer;color:var(--text);transition:background .2s;font-family:inherit}
.action-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.action-btn:hover{background:var(--border)}
.action-btn.plan-active{background:#262626;color:#fff;border-color:#262626}
[data-theme="dark"] .action-btn.plan-active{background:#f0f0f0;color:#000;border-color:#f0f0f0}
.action-btn.dots-btn{padding:8px 14px;font-size:1rem;font-weight:700;letter-spacing:1px;position:relative}
.plan-controls{display:flex;align-items:center;gap:8px;margin-left:auto}
.plan-label{font-size:.82rem;font-weight:600;color:var(--accent)}
.plan-btn{padding:7px 16px;border-radius:20px;border:none;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.plan-cancel{background:var(--badge-bg);color:var(--text)}
.plan-save{background:var(--accent);color:#fff}
.dots-menu{position:absolute;top:calc(100% + 2px);right:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;min-width:220px;box-shadow:0 8px 30px var(--shadow);z-index:200;overflow:hidden;display:none}
.dots-menu.open{display:block}
.dots-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:10px 14px 4px}
.dots-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:.88rem;cursor:pointer;color:var(--text);transition:background .15s}
.dots-item:hover{background:var(--badge-bg)}
.dots-item.danger{color:#e04040}
.dots-divider{height:1px;background:var(--border);margin:4px 0}
.toggle-switch{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
.toggle-switch.on{background:#4caf50}
.toggle-switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch.on::after{left:20px}
.filter-dropdown-row{padding:6px 14px 10px;display:flex;flex-direction:column;gap:6px}
.filter-select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;background:var(--bg);color:var(--text);outline:none;cursor:pointer;font-family:inherit}
.filter-active-tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
.filter-tag{display:flex;align-items:center;gap:3px;background:var(--accent);color:#fff;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:600}
.filter-tag button{background:none;border:none;color:#fff;cursor:pointer;font-size:.72rem;padding:0;line-height:1}
.filter-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;top:6px;right:6px}
.view-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.view-tab{flex:1;display:flex;align-items:center;justify-content:center;padding:11px 0;cursor:pointer;border-bottom:2px solid transparent;color:var(--subtext);transition:all .2s}
.view-tab.active{border-bottom-color:var(--text);color:var(--text)}
.view-tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view-tab.active svg{stroke-width:2.2}
.grid-wrap{padding:2px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
#grid.cols-5{grid-template-columns:repeat(5,1fr)}
.cell{position:relative;aspect-ratio:1;background:var(--border);cursor:grab;overflow:hidden}
.cell:active{cursor:grabbing}
.cell.dragging{opacity:.5}
.cell.drag-over{outline:3px solid var(--accent)}
.cell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
.cell .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:var(--badge-bg)}
.cell-badge{position:absolute;pointer-events:none;z-index:2}
.pin-badge{top:6px;right:6px;font-size:.9rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.format-badge{top:6px;left:6px;background:rgba(255,255,255,.92);border-radius:5px;padding:2px 5px;font-size:.65rem;font-weight:700;color:#262626}
.clock-badge{bottom:6px;left:6px;background:#262626;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.65rem}
.date-overlay{inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;position:absolute}
.date-pill{background:#262626;color:#fff;border-radius:20px;padding:4px 10px;font-size:.75rem;font-weight:700}
.hover-overlay{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;opacity:0;transition:opacity .2s;z-index:3;pointer-events:none}
.cell:hover .hover-overlay{opacity:1}
.hover-date{color:#fff;font-size:.72rem;font-weight:600;text-align:center}
.hover-status{margin-top:4px;padding:2px 7px;border-radius:20px;font-size:.62rem;font-weight:700;text-transform:uppercase}
.layer-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;cursor:pointer;border-radius:2px;position:relative;text-align:center;padding:4px}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:flex-end;justify-content:center}
#lightbox.open{display:flex}
.lb-sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.lb-sheet::-webkit-scrollbar{display:none}
.lb-img-wrap{position:relative;background:#000}
#lbImg{width:100%;aspect-ratio:1;object-fit:cover;display:none}
#lbVideo{width:100%;aspect-ratio:1;object-fit:cover;display:none;background:#000}
.lb-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;line-height:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer;z-index:5;display:none;align-items:center;justify-content:center;font-weight:700}
#lbPrev{left:8px}
#lbNext{right:8px}
#lbDots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:5}
#lbTypeBadge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;border-radius:6px;padding:3px 8px;font-size:.72rem;font-weight:700;display:none}
.lb-actions{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.lb-actions-left{display:flex;gap:16px}
.lb-action-icon{font-size:1.5rem;cursor:pointer;line-height:1}
.lb-body{padding:0 14px 24px}
.lb-caption-row{font-size:.9rem;line-height:1.55;margin-top:2px}
.lb-username{font-weight:700}
.lb-caption-text{white-space:pre-wrap}
.lb-date{font-size:.78rem;color:var(--subtext);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lb-tag{padding:4px 11px;border-radius:20px;font-size:.72rem;font-weight:600}
.lb-copy-btn{background:var(--badge-bg);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:8px 16px;font-size:.82rem;cursor:pointer;margin-top:10px;font-family:inherit}
.lb-add-note{width:100%;padding:12px;background:none;border:none;border-top:1px solid var(--border);color:var(--subtext);font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-family:inherit}
.lb-add-note:hover{background:var(--badge-bg)}
.s-posted,.s-completed{background:#4caf5022;color:#2e7d32}
.s-scheduled{background:#2196f322;color:#1565c0}
.s-draft{background:#ff980022;color:#e65100}
.s-design{background:#9c27b022;color:#6a1b9a}
.s-idea{background:#00bcd422;color:#006064}
.s-default{background:#9e9e9e22;color:#555}
.p-educate{background:#FFD6C0;color:#8B3A1A}
.p-inspire{background:#FFB3C1;color:#8B1A2A}
.p-entertain{background:#C8B8D4;color:#3A1A5C}
.p-promote{background:#C8D4E0;color:#1A2A3C}
.p-bts{background:#B3D4FF;color:#1A3A6B}
.p-proof{background:#B3E0CC;color:#1A5C3A}
.p-default{background:#E8E8E8;color:#555}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 20px;color:var(--subtext);grid-column:1/-1}
.empty-state .emoji{font-size:2.2rem}
.empty-state p{margin-top:8px;font-size:.88rem}
.footer{text-align:center;padding:8px;font-size:.7rem;color:var(--subtext)}
.sync-bar{text-align:center;font-size:.72rem;color:var(--subtext);padding:3px 0;min-height:20px}
</style>
</head>
<body>

<div id="setup">
<div class="setup-card">
  <h1>📸 IG Grid Planner</h1>
  <p>Connect your Notion database and set up your profile.</p>
  <div class="section-label">Notion Connection</div>
  <label>Integration Token</label>
  <input type="password" id="token" placeholder="ntn_ or secret_..."/>
  <label>Database ID</label>
  <input type="text" id="dbId" placeholder="32-character database ID"/>
  <div class="section-label">Profile</div>
  <div class="field-row">
    <div><label>Username</label><input type="text" id="profUsername" placeholder="@yourhandle"/></div>
    <div><label>Display Name</label><input type="text" id="profDisplay" placeholder="Your Name"/></div>
  </div>
  <label>Bio</label>
  <textarea id="profBio" placeholder="✨ Your bio here"></textarea>
  <label>Website URL</label>
  <input type="text" id="profWebsite" placeholder="https://yourwebsite.com"/>
  <label>Profile Photo URL (optional)</label>
  <input type="text" id="profPhoto" placeholder="https://..."/>
  <div class="section-label">Story Highlights (up to 5)</div>
  <div id="highlightInputs"></div>
  <div class="section-label">Property Names</div>
  <div class="field-row">
    <div><label>Title</label><input type="text" id="propTitle" value="Name"/></div>
    <div><label>Caption</label><input type="text" id="propCaption" value="Caption"/></div>
  </div>
  <div class="field-row">
    <div><label>Image URL</label><input type="text" id="propImage" value="Image URL"/></div>
    <div><label>Schedule Date</label><input type="text" id="propDate" value="Schedule Date"/></div>
  </div>
  <div class="field-row">
    <div><label>Status</label><input type="text" id="propStatus" value="Status"/></div>
    <div><label>Platform</label><input type="text" id="propPlatform" value="Platform"/></div>
  </div>
  <div class="field-row">
    <div><label>Format</label><input type="text" id="propFormat" value="Format"/></div>
    <div><label>Content Pillar</label><input type="text" id="propPillar" value="Content Pillar"/></div>
  </div>
  <div class="field-row">
    <div><label>Order</label><input type="text" id="propOrder" value="Order"/></div>
    <div><label>Pin Post</label><input type="text" id="propPin" value="Pin Post"/></div>
  </div>
  <div class="field-row">
    <div><label>Attachments</label><input type="text" id="propAttach" value="Attachments"/></div>
    <div><label>Cover (Reel thumbnail)</label><input type="text" id="propCover" value="Cover"/></div>
  </div>
  <div class="field-row">
    <div><label>Max Posts</label><input type="number" id="maxPosts" value="30" min="3" max="60"/></div>
  </div>
  <button class="btn-primary" onclick="connect()">Connect & Load Grid →</button>
  <div class="error-msg" id="errMsg"></div>
</div>
</div>

<div id="widget">
  <div id="profileSection">
    <div class="profile-top">
      <div id="avatarWrap"></div>
      <div class="profile-names">
        <div class="profile-username" id="dispUsername"></div>
        <div class="profile-displayname" id="dispDisplay"></div>
      </div>

    </div>
    <div class="profile-bio" id="dispBio"></div>
    <a class="profile-link" id="dispLink" href="#" target="_blank"></a>
    <div id="highlightsRow"></div>
  </div>

  <div class="action-bar" id="actionBar">
    <button class="action-btn" onclick="refreshGrid()">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
      Refresh
    </button>
    <button class="action-btn" id="planBtn" onclick="togglePlan()">Plan</button>
    <button class="action-btn dots-btn" id="dotsBtn" onclick="toggleDotsMenu()">
      ···<div class="filter-dot" id="filterDot" style="display:none"></div>
    </button>
    <div class="plan-controls" id="planControls" style="display:none">
      <span class="plan-label">Plan: ON</span>
      <button class="plan-btn plan-cancel" onclick="cancelPlan()">Cancel</button>
      <button class="plan-btn plan-save" onclick="savePlan()">Save</button>
    </div>
    <div class="dots-menu" id="dotsMenu">
      <div class="dots-section-title">Filters</div>
      <div class="filter-dropdown-row">
        <select class="filter-select" id="filterPlatformSel" onchange="onFilterChange()"><option value="all">All Platforms</option></select>
        <select class="filter-select" id="filterStatusSel" onchange="onFilterChange()"><option value="all">All Status</option></select>
        <select class="filter-select" id="filterFormatSel" onchange="onFilterChange()"><option value="all">All Formats</option></select>
      </div>
      <div class="filter-active-tags" id="activeTags"></div>
      <div class="dots-divider"></div>
      <div class="dots-section-title">Profile</div>
      <div class="dots-item" onclick="toggleBio()"><span>Show bio</span><div class="toggle-switch" id="bioToggle"></div></div>
      <div class="dots-item" onclick="toggleHighlights()"><span>Show highlights</span><div class="toggle-switch" id="hlToggle"></div></div>
      <div class="dots-divider"></div>
      <div class="dots-section-title">View</div>
      <div class="dots-item" onclick="toggleTheme()"><span id="themeLabel">Dark mode</span><div class="toggle-switch" id="themeToggle"></div></div>
      <div class="dots-divider"></div>
      <div class="dots-item danger" onclick="resetWidget();closeDotsMenu()">Disconnect</div>
    </div>
  </div>

  <div class="view-tabs">
    <div class="view-tab active" id="tab-grid" onclick="setView('grid')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </div>
    <div class="view-tab" id="tab-reels" onclick="setView('reels')">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
    </div>
    <div class="view-tab" id="tab-stories" onclick="setView('stories')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
    </div>
    <div class="view-tab" id="tab-layers" onclick="setView('layers')">
      <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    </div>
  </div>

  <div class="sync-bar" id="syncStatus"></div>
  <div class="grid-wrap"><div id="grid"></div></div>
  <div class="footer" id="postCount"></div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div class="lb-sheet" onclick="event.stopPropagation()">
    <div class="lb-img-wrap">
      <img id="lbImg" src="" alt=""/>
      <video id="lbVideo" controls></video>
      <button class="lb-nav" id="lbPrev" onclick="carouselNav(-1)">‹</button>
      <button class="lb-nav" id="lbNext" onclick="carouselNav(1)">›</button>
      <div id="lbDots"></div>
      <div id="lbTypeBadge"></div>
      <button class="lb-close" onclick="closeLightbox()">✕</button>
    </div>
    <div class="lb-actions">
      <div class="lb-actions-left">
        <span class="lb-action-icon">♡</span>
        <span class="lb-action-icon">💬</span>
        <span class="lb-action-icon">↺</span>
        <span class="lb-action-icon">✈️</span>
      </div>
      <span class="lb-action-icon">🔖</span>
    </div>
    <div class="lb-body">
      <div class="lb-caption-row"><span class="lb-username" id="lbUsername"></span> <span class="lb-caption-text" id="lbCaption"></span></div>
      <div class="lb-date" id="lbDate"></div>
      <div class="lb-tags" id="lbTags"></div>
      <button class="lb-copy-btn" id="lbCopyBtn" onclick="copyCaption()">📋 Copy caption</button>
      <button class="lb-add-note">✏️ Add a note</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY='ig_grid_planner_v1';
let cfg={},posts=[],allPosts=[],dragSrcIdx=null,theme='light';
let filterPlatform='all',filterStatus='all',filterFormat='all';
let currentView='grid',planMode=false,planOriginal=[];
let showBio=true,showHighlights=true;
let profile={username:'',display:'',bio:'',website:'',photo:'',highlights:[]};
let lbMediaFiles=[],lbCurrentIdx=0;
const isVideo=url=>/\.(mp4|mov|webm|ogg)(\?|$)/i.test(url);

// ── Persistence ──────────────────────────────────────────────────────
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({cfg,profile}));}catch(e){}
}
function loadState(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(!saved)return false;
    const data=JSON.parse(saved);
    if(!data.cfg||!data.cfg.token||!data.cfg.dbId)return false;
    cfg=data.cfg;profile=data.profile||{};
    return true;
  }catch(e){return false;}
}
function clearState(){
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
}

// ── Setup highlights ─────────────────────────────────────────────────
function buildHighlightInputs(){
  const wrap=document.getElementById('highlightInputs');wrap.innerHTML='';
  for(let i=1;i<=5;i++){
    const row=document.createElement('div');row.className='highlight-row';
    row.innerHTML=`<div><label>Highlight ${i} Label</label><input type="text" id="hl${i}label" placeholder="e.g. Reels"/></div><div><label>Cover URL</label><input type="text" id="hl${i}img" placeholder="https://..."/></div>`;
    wrap.appendChild(row);
  }
}
buildHighlightInputs();

// ── Auto-reconnect on load ───────────────────────────────────────────
window.addEventListener('load',async()=>{
  if(loadState()){
    document.getElementById('setup').style.display='none';
    document.getElementById('widget').style.display='block';
    renderProfile();
    await refreshGrid();
  }
});

// ── Connect ──────────────────────────────────────────────────────────
async function connect(){
  const token=document.getElementById('token').value.trim();
  const dbId=document.getElementById('dbId').value.trim().replace(/-/g,'');
  document.getElementById('errMsg').style.display='none';
  if(!token||!dbId){showErr('Please fill in token and database ID.');return;}
  profile={
    username:document.getElementById('profUsername').value.trim()||'@username',
    display:document.getElementById('profDisplay').value.trim()||'Display Name',
    bio:document.getElementById('profBio').value.trim(),
    website:document.getElementById('profWebsite').value.trim(),
    photo:document.getElementById('profPhoto').value.trim(),
    highlights:[]
  };
  for(let i=1;i<=5;i++){
    const lbl=document.getElementById(`hl${i}label`).value.trim();
    const img=document.getElementById(`hl${i}img`).value.trim();
    if(lbl)profile.highlights.push({label:lbl,img});
  }
  cfg={token,dbId,
    propTitle:document.getElementById('propTitle').value.trim()||'Name',
    propCaption:document.getElementById('propCaption').value.trim()||'Caption',
    propImage:document.getElementById('propImage').value.trim()||'Image URL',
    propDate:document.getElementById('propDate').value.trim()||'Schedule Date',
    propStatus:document.getElementById('propStatus').value.trim()||'Status',
    propPlatform:document.getElementById('propPlatform').value.trim()||'Platform',
    propFormat:document.getElementById('propFormat').value.trim()||'Format',
    propPillar:document.getElementById('propPillar').value.trim()||'Content Pillar',
    propOrder:document.getElementById('propOrder').value.trim()||'Order',
    propPin:document.getElementById('propPin').value.trim()||'Pin Post',
    propAttach:document.getElementById('propAttach').value.trim()||'Attachments',
    propCover:document.getElementById('propCover').value.trim()||'Cover',
    maxPosts:parseInt(document.getElementById('maxPosts').value)||30,
  };
  saveState();
  document.getElementById('setup').style.display='none';
  document.getElementById('widget').style.display='block';
  renderProfile();
  await refreshGrid();
}

function showErr(msg){
  const e=document.getElementById('errMsg');e.textContent='⚠ '+msg;e.style.display='block';
  document.getElementById('setup').style.display='flex';document.getElementById('widget').style.display='none';
}

// ── Profile ──────────────────────────────────────────────────────────
function renderProfile(){
  document.getElementById('dispUsername').textContent=profile.username||'@username';
  document.getElementById('dispDisplay').textContent=profile.display||'Display Name';
  document.getElementById('dispBio').textContent=profile.bio||'';
  const link=document.getElementById('dispLink');
  if(profile.website){link.textContent=profile.website;link.href=profile.website;}else{link.style.display='none';}
  const aw=document.getElementById('avatarWrap');aw.innerHTML='';
  if(profile.photo){
    const img=document.createElement('img');img.src=profile.photo;img.className='profile-avatar';aw.appendChild(img);
  }else{
    const ph=document.createElement('div');ph.className='profile-avatar-placeholder';
    ph.innerHTML=`<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    aw.appendChild(ph);
  }
  const hr=document.getElementById('highlightsRow');hr.innerHTML='';
  (profile.highlights||[]).forEach(h=>{
    const item=document.createElement('div');item.className='highlight-item';
    const circle=document.createElement('div');circle.className='highlight-circle';
    if(h.img){const img=document.createElement('img');img.src=h.img;circle.appendChild(img);}
    const lbl=document.createElement('div');lbl.className='highlight-label';lbl.textContent=h.label;
    item.appendChild(circle);item.appendChild(lbl);hr.appendChild(item);
  });
  updateProfileVisibility();updateToggles();
}

function updateProfileVisibility(){
  document.getElementById('dispBio').style.display=showBio?'block':'none';
  document.getElementById('dispLink').style.display=(showBio&&profile.website)?'block':'none';
  document.getElementById('highlightsRow').style.display=(showHighlights&&(profile.highlights||[]).length)?'flex':'none';
}

// ── Notion API ───────────────────────────────────────────────────────
async function notionQuery(){
  const res=await fetch(`https://api.notion.com/v1/databases/${cfg.dbId}/query`,{
    method:'POST',
    headers:{'Authorization':`Bearer ${cfg.token}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'},
    body:JSON.stringify({sorts:[{property:cfg.propPin,direction:'descending'},{property:cfg.propOrder,direction:'ascending'}],page_size:cfg.maxPosts})
  });
  if(!res.ok){const j=await res.json();throw new Error(j.message||res.statusText);}
  return(await res.json()).results;
}

async function notionPatch(pageId,orderVal){
  await fetch(`https://api.notion.com/v1/pages/${pageId}`,{
    method:'PATCH',
    headers:{'Authorization':`Bearer ${cfg.token}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'},
    body:JSON.stringify({properties:{[cfg.propOrder]:{number:orderVal}}})
  });
}

// ── Parse ────────────────────────────────────────────────────────────
function parsePosts(results){
  return results.map((p,i)=>{
    const pr=p.properties;
    const attachFiles=pr[cfg.propAttach]?.files||[];
    const attachUrls=attachFiles.map(f=>f?.file?.url||f?.external?.url).filter(Boolean);
    const imageUrl=pr[cfg.propImage]?.url||pr[cfg.propImage]?.files?.[0]?.file?.url||pr[cfg.propImage]?.files?.[0]?.external?.url||attachUrls[0]||'';
    const coverUrl=pr[cfg.propCover]?.files?.[0]?.file?.url||pr[cfg.propCover]?.files?.[0]?.external?.url||pr[cfg.propCover]?.url||'';
    const gridUrl=coverUrl||imageUrl;
    const mediaFiles=attachUrls.length>0?attachUrls:(imageUrl?[imageUrl]:[]);
    const mediaType=mediaFiles.length>1?'carousel':(mediaFiles[0]&&isVideo(mediaFiles[0])?'video':'image');
    const title=pr[cfg.propTitle]?.title?.map(t=>t.plain_text).join('')||'';
    const caption=pr[cfg.propCaption]?.rich_text?.map(t=>t.plain_text).join('')||'';
    let date='',dateShort='',soon=false;
    if(pr[cfg.propDate]?.date?.start){
      const d=new Date(pr[cfg.propDate].date.start);
      date=d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
      dateShort=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
      const diff=(d-new Date())/(1000*60*60*24);
      soon=diff>=0&&diff<=3;
    }
    const status=pr[cfg.propStatus]?.select?.name||pr[cfg.propStatus]?.status?.name||'';
    const platform=pr[cfg.propPlatform]?.select?.name||'';
    const format=pr[cfg.propFormat]?.select?.name||'';
    const pillar=pr[cfg.propPillar]?.select?.name||'';
    const order=pr[cfg.propOrder]?.number??(i+1);
    const pinned=pr[cfg.propPin]?.checkbox||false;
    return{id:p.id,imageUrl:gridUrl,mediaFiles,mediaType,title,caption,date,dateShort,status,platform,format,pillar,order,pinned,soon};
  });
}

// ── Helpers ──────────────────────────────────────────────────────────
function statusClass(s){const v=(s||'').toLowerCase();if(v.includes('complet')||v.includes('post'))return 's-posted';if(v.includes('sched'))return 's-scheduled';if(v.includes('draft'))return 's-draft';if(v.includes('design'))return 's-design';if(v.includes('idea'))return 's-idea';return 's-default';}
function pillarClass(p){const v=(p||'').toLowerCase();if(v.includes('educat'))return 'p-educate';if(v.includes('inspir'))return 'p-inspire';if(v.includes('entertain'))return 'p-entertain';if(v.includes('promot'))return 'p-promote';if(v.includes('bts'))return 'p-bts';if(v.includes('proof'))return 'p-proof';return 'p-default';}
function formatIcon(f){const v=(f||'').toLowerCase();if(v.includes('carousel'))return '⊞';if(v.includes('reel'))return '▶';return '';}

// ── Filters ──────────────────────────────────────────────────────────
function getFiltered(){
  return allPosts.filter(p=>{
    const mp=filterPlatform==='all'||(p.platform||'').toLowerCase()===filterPlatform.toLowerCase();
    const ms=filterStatus==='all'||(p.status||'').toLowerCase()===filterStatus.toLowerCase();
    const mf=filterFormat==='all'||(p.format||'').toLowerCase()===filterFormat.toLowerCase();
    return mp&&ms&&mf;
  });
}
function buildFilterSelects(){
  const platforms=['all',...new Set(allPosts.map(p=>p.platform).filter(Boolean))];
  const statuses=['all',...new Set(allPosts.map(p=>p.status).filter(Boolean))];
  const formats=['all',...new Set(allPosts.map(p=>p.format).filter(Boolean))];
  fillSelect('filterPlatformSel',platforms,'All Platforms',filterPlatform);
  fillSelect('filterStatusSel',statuses,'All Status',filterStatus);
  fillSelect('filterFormatSel',formats,'All Formats',filterFormat);
  renderActiveTags();updateFilterDot();
}
function fillSelect(id,values,allLabel,current){
  const sel=document.getElementById(id);sel.innerHTML='';
  values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v==='all'?allLabel:v;if(v===current)o.selected=true;sel.appendChild(o);});
}
function onFilterChange(){
  filterPlatform=document.getElementById('filterPlatformSel').value;
  filterStatus=document.getElementById('filterStatusSel').value;
  filterFormat=document.getElementById('filterFormatSel').value;
  posts=getFiltered();renderGrid();renderActiveTags();updateFilterDot();
}
function updateFilterDot(){document.getElementById('filterDot').style.display=(filterPlatform!=='all'||filterStatus!=='all'||filterFormat!=='all')?'block':'none';}
function renderActiveTags(){
  const wrap=document.getElementById('activeTags');wrap.innerHTML='';
  if(filterPlatform!=='all')wrap.appendChild(makeTag(filterPlatform,()=>{filterPlatform='all';document.getElementById('filterPlatformSel').value='all';onFilterChange();}));
  if(filterStatus!=='all')wrap.appendChild(makeTag(filterStatus,()=>{filterStatus='all';document.getElementById('filterStatusSel').value='all';onFilterChange();}));
  if(filterFormat!=='all')wrap.appendChild(makeTag(filterFormat,()=>{filterFormat='all';document.getElementById('filterFormatSel').value='all';onFilterChange();}));
}
function makeTag(label,onRemove){
  const tag=document.createElement('div');tag.className='filter-tag';
  tag.innerHTML=`<span>${label}</span><button>✕</button>`;
  tag.querySelector('button').addEventListener('click',e=>{e.stopPropagation();onRemove();});return tag;
}

// ── View ─────────────────────────────────────────────────────────────
function setView(v){
  currentView=v;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+v).classList.add('active');
  renderGrid();
}

// ── Plan mode ────────────────────────────────────────────────────────
function togglePlan(){planMode=!planMode;if(planMode)planOriginal=[...posts.map(p=>({...p}))];document.getElementById('planBtn').classList.toggle('plan-active',planMode);document.getElementById('planControls').style.display=planMode?'flex':'none';renderGrid();}
function cancelPlan(){planMode=false;posts=[...planOriginal];document.getElementById('planBtn').classList.remove('plan-active');document.getElementById('planControls').style.display='none';renderGrid();}
async function savePlan(){planMode=false;document.getElementById('planBtn').classList.remove('plan-active');document.getElementById('planControls').style.display='none';renderGrid();await syncOrder();}

// ── Render ───────────────────────────────────────────────────────────
function renderGrid(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  if(currentView==='layers'){renderLayers();return;}
  if(currentView==='reels'){renderReels();return;}
  if(currentView==='stories'){renderStories();return;}
  if(posts.length===0){grid.innerHTML='<div class="empty-state"><div class="emoji">🔍</div><p>No posts match your filters.</p></div>';document.getElementById('postCount').textContent='';return;}
  posts.forEach((post,idx)=>{
    const cell=document.createElement('div');cell.className='cell'+(post.pinned?' pinned':'');cell.dataset.idx=idx;
    if(post.imageUrl){const img=document.createElement('img');img.src=post.imageUrl;img.alt=post.title;img.loading='lazy';cell.appendChild(img);}
    else{const ph=document.createElement('div');ph.className='no-img';ph.textContent='🖼';cell.appendChild(ph);}
    if(post.pinned){const b=document.createElement('div');b.className='cell-badge pin-badge';b.textContent='📌';cell.appendChild(b);}
    const fi=formatIcon(post.format);if(fi){const b=document.createElement('div');b.className='cell-badge format-badge';b.textContent=fi;cell.appendChild(b);}
    if(post.soon){const b=document.createElement('div');b.className='cell-badge clock-badge';b.textContent='🕐';cell.appendChild(b);}
    if(planMode&&post.dateShort){const ov=document.createElement('div');ov.className='date-overlay';const pill=document.createElement('div');pill.className='date-pill';pill.textContent=post.dateShort;ov.appendChild(pill);cell.appendChild(ov);}
    else{const ov=document.createElement('div');ov.className='hover-overlay';if(post.date){const d=document.createElement('div');d.className='hover-date';d.textContent='📅 '+post.date;ov.appendChild(d);}if(post.status){const sb=document.createElement('div');sb.className='hover-status '+statusClass(post.status);sb.textContent=post.status;ov.appendChild(sb);}cell.appendChild(ov);}
    cell.addEventListener('click',()=>openLightbox(post));
    if(!planMode){
      cell.draggable=true;
      cell.addEventListener('dragstart',e=>{dragSrcIdx=idx;cell.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      cell.addEventListener('dragend',()=>{cell.classList.remove('dragging');document.querySelectorAll('.cell').forEach(c=>c.classList.remove('drag-over'));});
      cell.addEventListener('dragover',e=>{e.preventDefault();});
      cell.addEventListener('dragenter',()=>{if(dragSrcIdx!==idx)cell.classList.add('drag-over');});
      cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
      cell.addEventListener('drop',e=>{e.preventDefault();if(dragSrcIdx!==null&&dragSrcIdx!==idx)onDrop(idx);});
    }
    grid.appendChild(cell);
  });
  const total=allPosts.length,shown=posts.length;
  document.getElementById('postCount').textContent=shown===total?`${total} post${total!==1?'s':''} loaded`:`Showing ${shown} of ${total} posts`;
}

function renderLayers(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  if(posts.length===0){grid.innerHTML='<div class="empty-state"><div class="emoji">🔍</div><p>No posts found.</p></div>';return;}
  posts.forEach(post=>{
    const cell=document.createElement('div');cell.className='layer-cell '+pillarClass(post.pillar);cell.textContent=post.pillar||'—';
    if(post.pinned){const b=document.createElement('div');b.style.cssText='position:absolute;top:4px;right:4px;font-size:.7rem';b.textContent='📌';cell.appendChild(b);}
    const fi=formatIcon(post.format);if(fi){const b=document.createElement('div');b.style.cssText='position:absolute;top:4px;left:4px;font-size:.65rem;background:rgba(255,255,255,.75);border-radius:3px;padding:1px 3px';b.textContent=fi;cell.appendChild(b);}
    cell.addEventListener('click',()=>openLightbox(post));grid.appendChild(cell);
  });
}

function renderReels(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  const reels=posts.filter(p=>(p.format||'').toLowerCase().includes('reel'));
  if(reels.length===0){grid.innerHTML='<div class="empty-state"><div class="emoji">🎬</div><p>No Reels found.<br>Set Format to "Reel" in Notion.</p></div>';return;}
  reels.forEach(post=>{
    const cell=document.createElement('div');cell.className='cell';
    if(post.imageUrl){const img=document.createElement('img');img.src=post.imageUrl;img.loading='lazy';cell.appendChild(img);}
    else{const ph=document.createElement('div');ph.className='no-img';ph.textContent='▶';cell.appendChild(ph);}
    const b=document.createElement('div');b.className='cell-badge format-badge';b.textContent='▶';cell.appendChild(b);
    const ov=document.createElement('div');ov.className='hover-overlay';if(post.date){const d=document.createElement('div');d.className='hover-date';d.textContent='📅 '+post.date;ov.appendChild(d);}cell.appendChild(ov);
    cell.addEventListener('click',()=>openLightbox(post));grid.appendChild(cell);
  });
  document.getElementById('postCount').textContent=`${reels.length} Reel${reels.length!==1?'s':''}`;
}

function renderStories(){
  const grid=document.getElementById('grid');grid.style.gridTemplateColumns='repeat(3,1fr)';grid.innerHTML='';
  if(posts.length===0){grid.innerHTML='<div class="empty-state"><div class="emoji">◯</div><p>No posts found.</p></div>';return;}
  posts.forEach(post=>{
    const cell=document.createElement('div');cell.style.cssText='display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;cursor:pointer';
    const circle=document.createElement('div');circle.style.cssText=`width:66px;height:66px;border-radius:50%;overflow:hidden;border:2.5px solid ${post.pinned?'#f59e0b':'var(--accent)'};background:var(--badge-bg);display:flex;align-items:center;justify-content:center`;
    if(post.imageUrl){const img=document.createElement('img');img.src=post.imageUrl;img.style.cssText='width:100%;height:100%;object-fit:cover';circle.appendChild(img);}else{circle.textContent='🖼';}
    const lbl=document.createElement('div');lbl.style.cssText='font-size:.65rem;text-align:center;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)';lbl.textContent=post.title||'Post';
    cell.appendChild(circle);cell.appendChild(lbl);cell.addEventListener('click',()=>openLightbox(post));grid.appendChild(cell);
  });
  document.getElementById('postCount').textContent=`${posts.length} post${posts.length!==1?'s':''} loaded`;
}

// ── Drag & drop ──────────────────────────────────────────────────────
async function onDrop(targetIdx){const moved=posts.splice(dragSrcIdx,1)[0];posts.splice(targetIdx,0,moved);dragSrcIdx=null;renderGrid();await syncOrder();}
async function syncOrder(){
  document.getElementById('syncStatus').textContent='⏳ Syncing…';
  try{await Promise.all(posts.map((p,i)=>notionPatch(p.id,i+1)));document.getElementById('syncStatus').textContent='✅ Synced';setTimeout(()=>document.getElementById('syncStatus').textContent='',2500);}
  catch{document.getElementById('syncStatus').textContent='❌ Sync failed';}
}

// ── Refresh ──────────────────────────────────────────────────────────
async function refreshGrid(){
  document.getElementById('grid').innerHTML='<div class="spinner"></div>';
  document.getElementById('postCount').textContent='';
  try{const results=await notionQuery();allPosts=parsePosts(results);posts=getFiltered();buildFilterSelects();renderGrid();}
  catch(e){showErr(e.message);}
}

// ── Lightbox ─────────────────────────────────────────────────────────
function openLightbox(post){
  if(!post.mediaFiles||post.mediaFiles.length===0)return;
  lbMediaFiles=post.mediaFiles;lbCurrentIdx=0;
  document.getElementById('lbUsername').textContent=profile.username||'@username';
  const captionText=post.caption||post.title||'';
  document.getElementById('lbCaption').textContent=captionText;
  document.getElementById('lbDate').textContent=post.date?post.date.toUpperCase():'';
  const tags=document.getElementById('lbTags');tags.innerHTML='';
  if(post.status){const t=document.createElement('span');t.className='lb-tag '+statusClass(post.status);t.textContent=post.status;tags.appendChild(t);}
  if(post.format){const t=document.createElement('span');t.className='lb-tag s-default';t.textContent=post.format;tags.appendChild(t);}
  if(post.pillar){const t=document.createElement('span');t.className='lb-tag '+pillarClass(post.pillar);t.textContent=post.pillar;tags.appendChild(t);}
  document.getElementById('lbCopyBtn').style.display=captionText?'block':'none';
  const dotsWrap=document.getElementById('lbDots');dotsWrap.innerHTML='';
  if(lbMediaFiles.length>1){
    lbMediaFiles.forEach((_,i)=>{
      const dot=document.createElement('div');
      dot.style.cssText=`width:6px;height:6px;border-radius:50%;background:${i===0?'#fff':'rgba(255,255,255,0.5)'};transition:background .2s;cursor:pointer`;
      dot.onclick=()=>goToSlide(i);dotsWrap.appendChild(dot);
    });
  }
  document.getElementById('lbPrev').style.display=lbMediaFiles.length>1?'flex':'none';
  document.getElementById('lbNext').style.display=lbMediaFiles.length>1?'flex':'none';
  const badge=document.getElementById('lbTypeBadge');
  if(post.mediaType==='carousel'){badge.textContent='⊞ '+lbMediaFiles.length+' slides';badge.style.display='block';}
  else if(post.mediaType==='video'){badge.textContent='▶ Reel';badge.style.display='block';}
  else{badge.style.display='none';}
  renderLbSlide(0);
  document.getElementById('lightbox').classList.add('open');
}

function renderLbSlide(idx){
  lbCurrentIdx=idx;
  const url=lbMediaFiles[idx];
  const img=document.getElementById('lbImg');
  const vid=document.getElementById('lbVideo');
  if(!vid.paused)vid.pause();
  if(isVideo(url)){img.style.display='none';vid.style.display='block';vid.src=url;vid.load();}
  else{vid.style.display='none';img.style.display='block';img.src=url;}
  const dots=document.getElementById('lbDots').children;
  for(let i=0;i<dots.length;i++)dots[i].style.background=i===idx?'#fff':'rgba(255,255,255,0.5)';
  if(lbMediaFiles.length>1)document.getElementById('lbTypeBadge').textContent=`⊞ ${idx+1} / ${lbMediaFiles.length}`;
}

function goToSlide(idx){if(idx>=0&&idx<lbMediaFiles.length)renderLbSlide(idx);}
function carouselNav(dir){renderLbSlide((lbCurrentIdx+dir+lbMediaFiles.length)%lbMediaFiles.length);}

function closeLightbox(){
  const vid=document.getElementById('lbVideo');if(!vid.paused)vid.pause();
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lbImg').src='';document.getElementById('lbVideo').src='';
}

function copyCaption(){
  const text=document.getElementById('lbCaption').textContent;if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{const btn=document.getElementById('lbCopyBtn');btn.textContent='✅ Copied!';setTimeout(()=>btn.textContent='📋 Copy caption',2000);});
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')carouselNav(-1);
  if(e.key==='ArrowRight')carouselNav(1);
});
let touchStartX=0;
document.getElementById('lightbox').addEventListener('touchstart',e=>touchStartX=e.touches[0].clientX,{passive:true});
document.getElementById('lightbox').addEventListener('touchend',e=>{if(Math.abs(touchStartX-e.changedTouches[0].clientX)>50)carouselNav(touchStartX-e.changedTouches[0].clientX>0?1:-1);},{passive:true});

// ── Dots menu ────────────────────────────────────────────────────────
function toggleDotsMenu(){document.getElementById('dotsMenu').classList.toggle('open');}
function closeDotsMenu(){document.getElementById('dotsMenu').classList.remove('open');}
function toggleBio(){showBio=!showBio;updateProfileVisibility();updateToggles();}
function toggleHighlights(){showHighlights=!showHighlights;updateProfileVisibility();updateToggles();}
function updateToggles(){
  document.getElementById('bioToggle').className='toggle-switch'+(showBio?' on':'');
  document.getElementById('hlToggle').className='toggle-switch'+(showHighlights?' on':'');
}
function toggleTheme(){
  theme=theme==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',theme==='dark'?'dark':'');
  document.getElementById('themeToggle').className='toggle-switch'+(theme==='dark'?' on':'');
}
function resetWidget(){
  clearState();
  posts=[];allPosts=[];cfg={};profile={};filterPlatform='all';filterStatus='all';filterFormat='all';planMode=false;
  document.getElementById('widget').style.display='none';document.getElementById('setup').style.display='flex';
  document.getElementById('token').value='';document.getElementById('dbId').value='';
}
document.addEventListener('click',e=>{if(!e.target.closest('#dotsMenu')&&!e.target.closest('#dotsBtn')&&!e.target.closest('.profile-menu-btn'))closeDotsMenu();});
</script>
</body>
</html>
